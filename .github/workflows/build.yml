name: Build OpenJDK 25 for Android

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build_android:
    strategy:
      matrix:
        arch: ["aarch64"]
      fail-fast: false

    name: "Build for Android ${{matrix.arch}}"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Tailscale
      uses: tailscale/github-action@v4
      with:
        oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
        tags: tag:ci
        version: latest

    - name: Build with CI build script
      env:
        RUNNER_PASSWORD: ${{ secrets.RUNNER_PASSWORD }}
      run: |
        echo "runner:$RUNNER_PASSWORD" | sudo chpasswd
        bash "ci_build_arch_${{matrix.arch}}.sh"

    - name: Upload JRE build output
      uses: actions/upload-artifact@v4
      with:
        name: 'jre25-${{matrix.arch}}'
        path: jre25*.tar.xz

  fcl:
    needs: build_android
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Get jre25-aarch32
      uses: actions/download-artifact@v4
      with:
        name: jre25-aarch32
        path: fcl

    - name: Get jre25-aarch64
      uses: actions/download-artifact@v4
      with:
        name: jre25-aarch64
        path: fcl

    - name: Get jre25-x86_64
      uses: actions/download-artifact@v4
      with:
        name: jre25-x86_64
        path: fcl

    - name: Repack JRE
      run: bash "repack_jre.sh" $GITHUB_WORKSPACE/fcl $GITHUB_WORKSPACE/fcl/jre25-multiarch

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
          name: jre25-multiarch
          path: fcl/jre25-multiarch/*
